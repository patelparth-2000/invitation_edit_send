name: invitation_edit_send
description: "Design an invitation card once, then render one personalised card and PDF per guest."
publish_to: 'none'

version: 1.0.0+1
environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  path: ^1.9.0
  path_provider: ^2.1.5
  # flutter_whatsapp_stickers: ^1.0.1+5
  image: ^4.5.2
  syncfusion_flutter_pdf: ^28.1.38
  sqflite: ^2.4.1
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  image_cropper: ^8.1.0
  get: ^4.6.6
  intl_phone_field: ^3.2.0
  whatsapp: ^3.0.0
  share_plus: ^11.1.0
  # whatsapp_share2: ^2.0.2
  # url_launcher: ^6.3.1
  # shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.4.0+3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    # The old bitmap-font zips in fonts/font_zip/ are no longer bundled: card
    # text is rendered with Flutter's text engine (lib/utils/common.dart).

  fonts:
    # UI text (plan 5.1): one family with real weights.
    - family: Nunito
      fonts:
        - asset: fonts/nunito.ttf
        - asset: fonts/nunitolight.ttf
          weight: 300
        - asset: fonts/nunitobold.ttf
          weight: 700
        - asset: fonts/nunitoitalic.ttf
          style: italic
    # Gujarati: UI fallback and card-text fallback.
    - family: NotoSerif
      fonts:
        - asset: fonts/NotoSerifGujarati-VariableFont_wght.ttf
    - family: PlaywriteIN
      fonts:
        - asset: fonts/PlaywriteIN-VariableFont_wght.ttf

  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700